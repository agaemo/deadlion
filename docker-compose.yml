services:
  app:
    build: .
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
